authors="AlexThe666, GizmoTheMoonPig"
description='''What are we going to do today Pinky?

This is an UNOFFICIAL port of Rats to Minecraft 26.3, made with the help of AI. It is not made, checked or supported by
the Rats team. It is published with the maintainer's permission, only for Minecraft versions the official mod doesn't
support. Report problems to the port (Panda-s-Workshop/rats-unofficial), not to the Rats team.
Rats by AlexThe666 and GizmoTheMoonPig, LGPL-3.0. Includes Citadel (LGPL-3.0), ported to 26.3.'''

# load before us so we can properly replace the milk texture
[[dependencies.rats]]
    modId="neoforge"
    type="required"
    versionRange="[26.3,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.rats]]
    modId="citadel"
    type="required"
    versionRange="[26.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.rats]]
    modId="minecraft"
    type="required"
    versionRange="[26.3,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="rats.mixins.json"

[modproperties.rats]
    configuredBackground="rats:textures/block/marbled_cheese.png"
